[pytest]
asyncio_mode = auto
testpaths = tests
# The ignores are stale Nexus-terminal test copies left on local disk only
# (untracked + gitignored 2026-07-30; live originals in the Nexus repo).
# CI never sees them. Delete them from disk and these lines can go.
addopts = --ignore=tests/test_strategies.py --ignore=tests/test_api.py --ignore=tests/test_allocator.py
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = WARNING
